[project]
name = "brindex-ingest"
version = "0.1.0"
description = "Daily ingestion and parsing of official Brazilian market series (Tesouro Direto, PTAX, CDI) into a historical time-series database."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
brindex-ingest = "brindex_ingest.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
